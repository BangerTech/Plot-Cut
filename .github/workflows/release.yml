name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            archive: Plot-Cut-windows.zip
          - os: macos-latest
            label: macOS
            archive: Plot-Cut-macos.zip
          - os: ubuntu-latest
            label: Linux
            archive: Plot-Cut-linux.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean "Plot Cut.spec"

      - name: Pack archive
        shell: bash
        run: |
          python - <<'PY'
          import platform
          import stat
          import zipfile
          from pathlib import Path

          system = platform.system()
          archive = "${{ matrix.archive }}"
          if system == "Windows":
              sources = [Path("dist/Plot Cut.exe")]
          elif system == "Darwin":
              app = Path("dist/Plot Cut.app")
              sources = [p for p in app.rglob("*") if p.is_file()]
          else:
              sources = [Path("dist/Plot Cut")]
          missing = [p for p in sources if not p.exists()]
          if not sources or missing:
              raise SystemExit(f"build output missing: {missing or sources}")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sources:
                  info = zipfile.ZipInfo(path.relative_to("dist").as_posix())
                  mode = path.stat().st_mode
                  if system != "Windows":
                      mode |= stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH
                  info.external_attr = mode << 16
                  zf.writestr(info, path.read_bytes())
          print(archive)
          PY

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.archive }}" --clobber
