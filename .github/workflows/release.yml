name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            asset: Plot-Cut.exe
          - os: macos-latest
            label: macOS
            asset: Plot-Cut.dmg
          - os: ubuntu-latest
            label: Linux
            asset: Plot-Cut-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean "Plot Cut.spec"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "dist/Plot Cut.exe" "Plot-Cut.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            hdiutil create -volname "Plot Cut" -srcfolder "dist/Plot Cut.app" -ov -format UDZO "Plot-Cut.dmg"
          else
            cp "dist/Plot Cut" "Plot-Cut-linux"
            chmod +x "Plot-Cut-linux"
          fi
          test -f "${{ matrix.asset }}"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset }}" --clobber
